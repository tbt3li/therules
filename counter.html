<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan Chest Counts</title>
<style>
  :root{
    --bg:#0b1020; --card:#141b34; --card2:#1a2344; --line:#26315c;
    --text:#e8ecff; --muted:#93a0d1; --accent:#7c5cff; --accent2:#22d3ee;
    --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1ff; --card:#ffffff; --card2:#f4f6ff; --line:#dbe0f7; --text:#171c3a; --muted:#5b668f; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
    background:radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.25), transparent),
               radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.18), transparent), var(--bg);
    min-height:100vh;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  header{text-align:center;margin-bottom:24px}
  h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px);
     background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px}

  .countdown{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
  .cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;min-width:82px;text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.2)}
  .cd b{display:block;font-size:clamp(26px,6vw,38px);font-variant-numeric:tabular-nums}
  .cd span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cdlabel{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat small{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .stat strong{font-size:22px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input{flex:1;min-width:200px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--card);color:var(--text);font-size:15px;outline:none}
  .toolbar input:focus{border-color:var(--accent)}
  .btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:14px}
  .btn:hover{border-color:var(--accent)}

  .tablebox{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto;
            box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:70vh}
  table{width:100%;border-collapse:collapse;font-size:15px}
  thead th{position:sticky;top:0;background:var(--card2);padding:13px 14px;text-align:left;cursor:pointer;
           white-space:nowrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
           border-bottom:1px solid var(--line);user-select:none;z-index:1}
  thead th:hover{color:var(--text)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:nth-child(even){background:rgba(124,92,255,.05)}
  tbody tr:hover{background:rgba(124,92,255,.14)}
  tfoot td{position:sticky;bottom:0;background:var(--card2);padding:12px 14px;font-weight:700;border-top:1px solid var(--line)}
  .rank{width:56px;text-align:center !important}
  .medal{font-size:18px}

  .status{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;margin-left:6px}
  .ok{background:rgba(52,211,153,.15);color:var(--good)}
  .stale{background:rgba(251,191,36,.15);color:var(--warn)}
  .err{background:rgba(248,113,113,.15);color:var(--bad)}
  .msg{padding:40px;text-align:center;color:var(--muted)}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;
           animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  pre{white-space:pre-wrap;text-align:left;background:var(--card2);padding:12px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏆 Clan Chest Counts</h1>
    <div class="sub">Live weekly data • Refreshes every 2 hours • Weekly reset every Sunday 10:00 PM (Pakistan Time)</div>
  </header>

  <div class="countdown" id="countdown">
    <div class="cd"><b id="cd-d">0</b><span>Days</span></div>
    <div class="cd"><b id="cd-h">00</b><span>Hours</span></div>
    <div class="cd"><b id="cd-m">00</b><span>Minutes</span></div>
    <div class="cd"><b id="cd-s">00</b><span>Seconds</span></div>
  </div>
  <div class="cdlabel">until weekly reset — <span id="resetAt"></span></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 Search player...">
    <button class="btn" id="refreshBtn">⟳ Refresh now</button>
  </div>

  <div class="tablebox" id="tablebox">
    <div class="msg"><div class="spinner"></div>Loading data...</div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
(() => {
  const API = "/api/counts";
  const WEEK = 7 * 864e5;
  const TZ = "Asia/Karachi";
  const HIDE = /^(id|_id|uuid|user_?id|clan_?id|created_?at|updated_?at|url|avatar|image|icon)$/i;

  let rows = [], cols = [], sortKey = null, sortDir = -1, query = "";
  let meta = { weekEnd: nextReset(), nextRefresh: Date.now() + 6e4 };
  let loading = false;

  const $ = id => document.getElementById(id);
  const fmtDate = ms => new Date(ms).toLocaleString("en-PK", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" });
  const isNum = v => typeof v === "number" && isFinite(v);
  const pretty = k => String(k).replace(/[_\-.]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2")
                       .replace(/\b\w/g, c => c.toUpperCase());

  // ---- Countdown to Sunday 10:00 PM PKT (17:00 UTC) ----
  function nextReset() {
    const now = Date.now(), d = new Date(now);
    let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 17, 0, 0);
    t -= d.getUTCDay() * 864e5;
    if (t <= now) t += WEEK;
    return t;
  }
  function tick() {
    const now = Date.now();
    let target = nextReset();
    let ms = Math.max(0, target - now);
    const s = Math.floor(ms / 1000);
    $("cd-d").textContent = Math.floor(s / 86400);
    $("cd-h").textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, "0");
    $("cd-m").textContent = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    $("cd-s").textContent = String(s % 60).padStart(2, "0");
    $("resetAt").textContent = fmtDate(target) + " PKT";

    // auto refresh when the 2-hour slot ends (or the weekly reset passes)
    if (!loading && now >= meta.nextRefresh + 3000) load();
  }

  // ---- Find the list of players inside any JSON shape ----
  function findRows(d, depth = 0) {
    if (Array.isArray(d)) {
      if (d.length && typeof d[0] === "object" && d[0] !== null) return d;
      if (d.length) return d.map(v => ({ value: v }));
      return [];
    }
    if (d && typeof d === "object" && depth < 4) {
      let best = null;
      for (const k of Object.keys(d)) {
        const r = findRows(d[k], depth + 1);
        if (r && r.length && (!best || r.length > best.length)) best = r;
      }
      if (best) return best;
      // object map like { "PlayerA": 12, "PlayerB": 9 }
      const vals = Object.values(d);
      if (vals.length && vals.every(v => isNum(v))) {
        return Object.entries(d).map(([name, count]) => ({ name, count }));
      }
    }
    return [];
  }
  function flatten(o, prefix = "", out = {}) {
    for (const [k, v] of Object.entries(o)) {
      const key = prefix ? prefix + "." + k : k;
      if (v && typeof v === "object" && !Array.isArray(v) && prefix.split(".").length < 2) flatten(v, key, out);
      else out[key] = Array.isArray(v) ? v.join(", ") : v;
    }
    return out;
  }
  function build(data) {
    const showAll = new URLSearchParams(location.search).has("all");
    rows = findRows(data).map(r => flatten(r));
    const keys = [];
    rows.forEach(r => Object.keys(r).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
    cols = keys.filter(k => showAll || !HIDE.test(k.split(".").pop()))
               .map(k => ({ key: k, label: pretty(k.split(".").pop()), num: rows.some(r => isNum(r[k])) && rows.every(r => r[k] == null || isNum(r[k])) }));
    // default sort: first numeric column, high to low
    const firstNum = cols.find(c => c.num && !/rank|position/i.test(c.key));
    sortKey = firstNum ? firstNum.key : null; sortDir = -1;
  }

  // ---- Render ----
  function fmtCell(v, c) {
    if (v == null || v === "") return "—";
    if (c.num) return v.toLocaleString();
    if (typeof v === "boolean") return v ? "✔" : "✘";
    if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmtDate(Date.parse(v));
    return String(v);
  }
  function render() {
    const box = $("tablebox");
    if (!rows.length) { box.innerHTML = '<div class="msg">No data found in the response.</div>'; $("stats").innerHTML = ""; return; }

    let list = rows.filter(r => !query || Object.values(r).some(v => String(v).toLowerCase().includes(query)));
    if (sortKey) {
      list = [...list].sort((a, b) => {
        const x = a[sortKey], y = b[sortKey];
        if (isNum(x) && isNum(y)) return (x - y) * sortDir;
        return String(x ?? "").localeCompare(String(y ?? ""), undefined, { numeric: true }) * sortDir;
      });
    }

    const table = document.createElement("table");
    const thead = table.createTHead().insertRow();
    let th = document.createElement("th"); th.textContent = "#"; th.className = "rank"; thead.appendChild(th);
    cols.forEach(c => {
      th = document.createElement("th");
      th.textContent = c.label + (sortKey === c.key ? (sortDir > 0 ? " ▲" : " ▼") : "");
      if (c.num) th.className = "num";
      th.onclick = () => { sortDir = sortKey === c.key ? -sortDir : (c.num ? -1 : 1); sortKey = c.key; render(); };
      thead.appendChild(th);
    });

    const tb = table.createTBody();
    const medals = ["🥇", "🥈", "🥉"];
    list.forEach((r, i) => {
      const tr = tb.insertRow();
      const td = tr.insertCell(); td.className = "rank";
      td.innerHTML = (sortKey && !query && i < 3 && sortDir < 0) ? '<span class="medal">' + medals[i] + '</span>' : (i + 1);
      cols.forEach(c => { const cell = tr.insertCell(); cell.textContent = fmtCell(r[c.key], c); if (c.num) cell.className = "num"; });
    });

    const numCols = cols.filter(c => c.num && !/rank|position|level|id$/i.test(c.key));
    if (numCols.length) {
      const tr = table.createTFoot().insertRow();
      tr.insertCell().textContent = "Σ";
      cols.forEach(c => {
        const cell = tr.insertCell();
        if (numCols.includes(c)) { cell.className = "num"; cell.textContent = list.reduce((s, r) => s + (isNum(r[c.key]) ? r[c.key] : 0), 0).toLocaleString(); }
        else cell.textContent = c === cols[0] ? "Total" : "";
      });
    }
    box.innerHTML = ""; box.appendChild(table);

    // stat cards
    const st = $("stats");
    st.innerHTML = "";
    const add = (label, val) => { const d = document.createElement("div"); d.className = "stat";
      d.innerHTML = "<small></small><strong></strong>"; d.firstChild.textContent = label; d.lastChild.textContent = val; st.appendChild(d); };
    add("Players", rows.length.toLocaleString());
    numCols.slice(0, 3).forEach(c => add("Total " + c.label, rows.reduce((s, r) => s + (isNum(r[c.key]) ? r[c.key] : 0), 0).toLocaleString()));
    if (sortKey && numCols.find(c => c.key === sortKey)) {
      const top = [...rows].sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0))[0];
      const nameCol = cols.find(c => !c.num);
      if (top && nameCol) add("Top " + pretty(sortKey.split(".").pop()), String(top[nameCol.key]));
    }
  }

  // ---- Load ----
  async function load() {
    loading = true;
    $("refreshBtn").disabled = true;
    try {
      const res = await fetch(API + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      const j = await res.json();
      meta.weekEnd = j.weekEnd || meta.weekEnd;
      meta.nextRefresh = j.nextRefresh || Date.now() + 6e4;

      if (!j.ok) throw new Error(j.error || "Unknown error");
      build(j.data);
      render();

      const badge = j.stale ? '<span class="pill stale">showing last saved data</span>' : '<span class="pill ok">live</span>';
      $("status").innerHTML = "Data updated: " + fmtDate(j.fetchedAt) + " PKT " + badge +
        "<br>Next refresh: " + fmtDate(j.nextRefresh) + " PKT";
      if (new URLSearchParams(location.search).has("debug")) {
        const p = document.createElement("pre"); p.textContent = JSON.stringify(j.data, null, 2).slice(0, 6000);
        $("status").appendChild(p);
      }
    } catch (e) {
      if (!rows.length) $("tablebox").innerHTML = '<div class="msg">⚠️ Could not load data.<br><small></small></div>';
      const sm = $("tablebox").querySelector("small"); if (sm) sm.textContent = e.message;
      $("status").innerHTML = '<span class="pill err">error</span> Retrying automatically...';
    } finally {
      loading = false;
      $("refreshBtn").disabled = false;
    }
  }

  $("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
  $("refreshBtn").addEventListener("click", load);
  setInterval(tick, 1000); tick();
  load();
})();
</script>
</body>
</html>
