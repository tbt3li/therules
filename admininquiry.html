<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src data:; connect-src https://admininquiry.t3li.workers.dev https://login.t3li.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<script>
/* AUTH GATE: runs first. No token -> straight to the login page (page stays hidden).
   Token present -> the admin check starts immediately, in parallel with the page loading. */
(function () {
  var t = localStorage.getItem('family_token') || sessionStorage.getItem('family_token');
  if (!t) { document.documentElement.style.display = 'none'; location.replace('login.html'); return; }   // <-- your admin login page
  window.__ME = fetch('https://admininquiry.t3li.workers.dev/api/me', { headers: { Authorization: 'Bearer ' + t } })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); });
  window.__ME.catch(function () {});
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiry Center | Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0078d4;--primary-dark:#005a9e;--accent:#7c4dbd;--bg:#f3f2f1;--card:#fff;--text:#323130;--muted:#605e5c;--border:#e1dfdd;--input:#faf9f8;
  --ok:#28a745;--warn:#e69500;--bad:#dc3545;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px}
[data-theme="dark"]{--bg:#141413;--card:#1f1e1d;--text:#f3f2f1;--muted:#a19f9d;--border:#3b3a39;--input:#2b2a29;--shadow:0 2px 8px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.topbar{background:#201f1e;color:#fff;padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.topbar h1{font-size:19px;flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.topbar h1 i{color:#4aa8ff}
.who{font-size:13px;color:#c8c6c4;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.b-ok{background:#dff6dd;color:#107c10}.b-wait{background:#fff0cc;color:#8a5a00}.b-lvl{background:var(--input);color:var(--muted);border:1px solid var(--border)}
[data-theme="dark"] .b-ok{background:#12361a;color:#7bd88f}[data-theme="dark"] .b-wait{background:#4a3500;color:#ffcf66}
.ib{background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:8px;font-size:15px}
.ib:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:1300px;margin:0 auto;padding:24px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;gap:14px}
.stat .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12.5px;color:var(--muted)}
.two{grid-template-columns:2fr 1fr;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:12px}.card h3 i{color:var(--primary);margin-right:8px}
.bar-row{display:grid;grid-template-columns:60px 1fr 46px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.bar{height:9px;border-radius:6px;background:var(--input);border:1px solid var(--border);overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#f5b400,#ff8a00)}
.rate-row{display:flex;align-items:center;gap:14px;margin-top:6px}
.rate-big{font-size:38px;font-weight:700}.stars{color:#f5b400;letter-spacing:1px;white-space:nowrap}
.pbar{height:14px;border-radius:8px;background:var(--input);border:1px solid var(--border);overflow:hidden;margin:10px 0 6px}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--ok),#7bd88f);transition:width .4s}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);font-size:14px}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,120,212,.2)}
#q{flex:1;min-width:220px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);color:var(--text);padding:10px 16px;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--primary);color:#fff}
.btn{border:none;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){background:var(--primary-dark)}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.out{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.out:hover:not(:disabled){background:var(--primary);color:#fff}.btn.sm{padding:6px 11px;font-size:13px}
.bulk{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#e8f1fb;border:1px solid #b9d7f3;color:#05436f;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
.bulk.show{display:flex}
[data-theme="dark"] .bulk{background:#0e2a42;border-color:#1c4d77;color:#9fd1ff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--primary)}
tbody tr:hover td{background:var(--input)}
tr.pending td:first-child{box-shadow:inset 4px 0 0 var(--warn)}tr.done td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.sub{font-weight:600}.prev{color:var(--muted);font-size:13px;max-width:380px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.small{font-size:12.5px;color:var(--muted)}
.act{display:flex;gap:6px;flex-wrap:nowrap}
.mini{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px}
.mini:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary)}.mini.bad:hover:not(:disabled){background:var(--bad);border-color:var(--bad)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.pager .pg{display:flex;gap:8px;align-items:center}
.empty{text-align:center;padding:40px;color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;padding:26px;position:relative}
.modal .x{position:absolute;top:12px;right:12px;background:var(--input);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px}
.modal h2{padding-right:44px;margin-bottom:8px;word-break:break-word}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.meta div{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-word}
.meta small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.msg{white-space:pre-wrap;word-break:break-word;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:16px;line-height:1.65;font-size:14.5px;max-height:320px;overflow-y:auto}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;bottom:24px;right:24px;background:#323130;color:#fff;padding:13px 20px;border-radius:10px;z-index:900;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;max-width:360px}
.toast.ok{background:#1e7e34}.toast.err{background:#b02a37}
#loading,#denied{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:20px}
#denied{display:none;z-index:1000}
.spinner{border:4px solid var(--border);border-top:4px solid var(--primary);border-radius:50%;width:48px;height:48px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.two{grid-template-columns:1fr}.wrap{padding:14px}.topbar{padding:10px 14px}.who span.nm{display:none}}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p id="loadingText" style="color:var(--muted)">Verifying admin access...</p>
  <button class="btn" id="retryBtn" style="display:none" onclick="location.reload()">Retry</button></div>
<div id="denied"><i class="fas fa-ban" style="font-size:54px;color:var(--bad)"></i><h2>Access denied</h2>
  <p id="deniedMsg" style="color:var(--muted)">This page is for administrators only.</p>
  <div style="display:flex;gap:10px"><button class="btn out" id="deniedHome">Go to dashboard</button><button class="btn" id="deniedLogout">Log out</button></div></div>

<div id="app" style="display:none">
  <header class="topbar">
    <h1><i class="fas fa-inbox"></i> Inquiry Center <span class="badge b-lvl" style="color:#c8c6c4;border-color:#444;background:transparent">Admin</span></h1>
    <div class="who"><i class="fas fa-user-shield"></i><span class="nm" id="adminName">...</span></div>
    <button class="ib" id="refreshBtn" title="Refresh"><i class="fas fa-rotate"></i></button>
    <button class="ib" id="themeBtn" title="Dark mode"><i class="fas fa-moon"></i></button>
    <button class="ib" id="logoutBtn" title="Log out"><i class="fas fa-right-from-bracket"></i></button>
  </header>

  <div class="wrap">
    <div class="grid stats" id="statCards"></div>

    <div class="grid two">
      <div class="card"><h3><i class="fas fa-reply"></i> Reply progress</h3>
        <div id="progressBox"></div></div>
      <div class="card"><h3><i class="fas fa-star"></i> Ratings</h3><div id="ratingBox"></div></div>
    </div>

    <div class="card">
      <div class="filters">
        <input class="input" id="q" placeholder="Search name, email, subject, message or #id..." maxlength="100">
        <div class="seg" id="statusSeg"><button data-s="all" class="on">All</button><button data-s="pending">Not replied</button><button data-s="replied">Replied</button></div>
        <select class="input" id="rating"><option value="">Any rating</option><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option><option value="none">No rating</option></select>
        <input class="input" type="date" id="from" title="From date"><input class="input" type="date" id="to" title="To date">
        <select class="input" id="sort"><option value="created_at:desc">Newest first</option><option value="created_at:asc">Oldest first</option><option value="rating:desc">Highest rating</option><option value="rating:asc">Lowest rating</option><option value="name:asc">Name A-Z</option><option value="status:asc">Status</option></select>
        <select class="input" id="pageSize"><option>10</option><option selected>25</option><option>50</option><option>100</option></select>
        <button class="btn out" id="clearBtn"><i class="fas fa-filter-circle-xmark"></i> Reset</button>
        <button class="btn out" id="exportBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
      </div>

      <div class="bulk" id="bulkBar">
        <b id="bulkCount">0 selected</b>
        <button class="btn ok sm" data-bulk="replied"><i class="fas fa-check"></i> Mark replied</button>
        <button class="btn warn sm" data-bulk="pending"><i class="fas fa-clock"></i> Mark not replied</button>
        <button class="btn bad sm" data-bulk="delete"><i class="fas fa-trash"></i> Delete</button>
        <button class="btn out sm" id="bulkClear">Clear</button>
      </div>

      <div class="tw"><table>
        <thead><tr><th><input type="checkbox" id="selAll" title="Select page"></th><th>#</th><th>From</th><th>Subject / message</th><th>Rating</th><th>Received</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <div class="pager"><span id="pagerInfo"></span>
        <div class="pg"><button class="btn out sm" id="prevBtn"><i class="fas fa-chevron-left"></i> Prev</button><span id="pageNo"></span><button class="btn out sm" id="nextBtn">Next <i class="fas fa-chevron-right"></i></button></div></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============ CONFIG ============ */
const API = 'https://admininquiry.t3li.workers.dev/api';
const LOGIN_API = 'https://login.t3li.workers.dev/api';
const LOGIN_URL = 'login.html';          // your admin login page
const HOME_URL = 'dashboard.html';

/* ============ HELPERS ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const getToken = () => localStorage.getItem('family_token') || sessionStorage.getItem('family_token');
const clearToken = () => { localStorage.removeItem('family_token'); sessionStorage.removeItem('family_token'); };
const goLogin = () => { clearToken(); location.replace(LOGIN_URL); };
let TOKEN = null, ADMIN = null;

function toast(msg, type = '') {
  const o = document.querySelector('.toast'); if (o) o.remove();
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3800);
}
function parseDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number' || /^\d+$/.test(String(v))) { let n = +v; if (n < 1e12) n *= 1000; return new Date(n); }
  let s = String(v).trim();
  const hasTz = /[zZ]|[+-]\d{2}:?\d{2}$/.test(s);
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s)) s = s.replace(' ', 'T') + (hasTz ? '' : 'Z');
  else if (/^\d{4}-\d{2}-\d{2}T/.test(s) && !hasTz) s += 'Z';
  const d = new Date(s); return isNaN(d) ? null : d;
}
const fmtDate = (v) => { const d = parseDate(v); return d ? d.toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : esc(v || '-'); };
const stars = (r) => { if (r == null) return '<span class="small">-</span>'; const n = Math.max(0, Math.min(5, Math.round(+r) || 0)); return `<span class="stars" title="${n}/5">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`; };
const statusBadge = (it) => it.replied ? '<span class="badge b-ok"><i class="fas fa-check"></i> Replied</span>' : '<span class="badge b-wait"><i class="fas fa-clock"></i> Not replied</span>';

// only build a mailto: link for a strictly valid address (stops "a@b.com?bcc=evil" style injection from the public form)
const SAFE_EMAIL = /^[^\s@<>?&,;"'\\]+@[^\s@<>?&,;"'\\]+\.[^\s@<>?&,;"'\\]+$/;
function mailtoFor(it, fullMsg) {
  if (!SAFE_EMAIL.test(it.email || '')) return null;
  const d = parseDate(it.created_at);
  const quoted = String(fullMsg || it.preview || '').slice(0, 800).split(/\r?\n/).map(l => '> ' + l).join('\n');
  const body = 'Hi ' + (it.name || '') + ',\n\n\n\n--- Your message' + (d ? ' (' + d.toLocaleDateString() + ')' : '') + ' ---\n' + quoted;
  return 'mailto:' + it.email + '?subject=' + encodeURIComponent('Re: ' + (it.subject || 'Your inquiry')) + '&body=' + encodeURIComponent(body);
}

async function api(path, opts = {}) {
  const retry = !opts.method || opts.method === 'GET' || opts.method === 'PATCH';
  for (let i = 1; i <= (retry ? 2 : 1); i++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const res = await fetch(API + path, { ...opts, signal: ctl.signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN } });
      clearTimeout(timer);
      if (opts.raw && res.ok) return { success: true, res };
      if (res.status === 401) { goLogin(); return { success: false, error: 'Session expired' }; }
      if (res.status === 403) { showDenied(); return { success: false, error: 'Access denied' }; }
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      if (i === (retry ? 2 : 1)) return { success: false, error: 'Could not reach the server. Check your connection and try again.' };
    }
  }
}

/* ============ STATE ============ */
const S = { page: 1, pages: 1, total: 0, items: [], sel: new Set(), q: '', status: 'all', rating: '', from: '', to: '', sort: 'created_at', dir: 'desc', pageSize: 25 };
let reqId = 0;

function qs() {
  const p = new URLSearchParams();
  if (S.q) p.set('q', S.q); if (S.status !== 'all') p.set('status', S.status); if (S.rating) p.set('rating', S.rating);
  if (S.from) p.set('from', S.from); if (S.to) p.set('to', S.to); p.set('sort', S.sort); p.set('dir', S.dir);
  return p;
}

/* ============ LOADERS ============ */
async function loadStats() {
  const r = await api('/inquiries/stats'); if (!r.success) return;
  const s = r.stats;
  $('statCards').innerHTML = [
    ['fa-envelope', '#0078d4', s.total, 'Total inquiries'],
    ['fa-clock', '#e69500', s.pending, 'Not replied'],
    ['fa-circle-check', '#28a745', s.replied, 'Replied'],
    ['fa-star', '#f5b400', s.avgRating == null ? '-' : s.avgRating + ' / 5', 'Average rating'],
    ['fa-calendar-day', '#7c4dbd', s.today, 'Received today'],
    ['fa-calendar-week', '#00897b', s.week, 'Last 7 days']
  ].map(([i, c, v, l]) => `<div class="card stat"><div class="ico" style="background:${c}"><i class="fas ${i}"></i></div><div><b>${esc(v)}</b><span>${l}</span></div></div>`).join('');
  $('progressBox').innerHTML = `<div style="display:flex;justify-content:space-between;font-size:14px"><span><b>${s.replyRate}%</b> replied</span><span class="small">${s.replied} of ${s.total}</span></div>
    <div class="pbar"><div style="width:${s.replyRate}%"></div></div>
    <p class="small">${s.pending ? '<b style="color:var(--warn)">' + s.pending + '</b> inquiries are waiting for your reply.' : 'All inquiries have been answered. 🎉'}</p>`;
  const max = Math.max(1, ...Object.values(s.ratings));
  $('ratingBox').innerHTML = `<div class="rate-row"><div class="rate-big">${s.avgRating == null ? '-' : s.avgRating}</div><div>${stars(s.avgRating)}<div class="small">average rating</div></div></div><div style="margin-top:12px">` +
    [5, 4, 3, 2, 1].map(n => `<div class="bar-row"><span class="stars">${n} ★</span><div class="bar"><div style="width:${s.ratings[n] / max * 100}%"></div></div><span class="small">${s.ratings[n]}</span></div>`).join('') + '</div>';
}

async function loadList() {
  const my = ++reqId;
  const p = qs(); p.set('page', S.page); p.set('pageSize', S.pageSize);
  $('rows').innerHTML = '<tr><td colspan="8" class="empty"><div class="spinner" style="width:30px;height:30px;margin:0 auto"></div></td></tr>';
  const r = await api('/inquiries?' + p);
  if (my !== reqId) return;                                // ignore out-of-date responses
  if (!r.success) { $('rows').innerHTML = `<tr><td colspan="8" class="empty">${esc(r.error || 'Failed to load')}</td></tr>`; return; }
  S.items = r.items; S.total = r.total; S.page = r.page; S.pages = r.pages;
  renderRows();
}

function renderRows() {
  const rows = S.items.map(it => `<tr class="${it.replied ? 'done' : 'pending'}">
    <td><input type="checkbox" class="sel" data-id="${+it.id}" ${S.sel.has(it.id) ? 'checked' : ''}></td>
    <td class="small">#${+it.id}</td>
    <td><div class="sub">${esc(it.name) || '<i class="small">no name</i>'}</div><div class="small">${esc(it.email)}</div></td>
    <td><div class="sub">${esc(it.subject) || '<i class="small">no subject</i>'}</div><div class="prev">${esc(it.preview)}</div></td>
    <td>${stars(it.rating)}</td><td class="small">${fmtDate(it.created_at)}</td><td>${statusBadge(it)}</td>
    <td><div class="act">
      <button class="mini" data-act="view" data-id="${+it.id}" title="View full message"><i class="fas fa-eye"></i></button>
      <button class="mini" data-act="reply" data-id="${+it.id}" title="Reply by email"><i class="fas fa-reply"></i></button>
      <button class="mini" data-act="toggle" data-id="${+it.id}" title="${it.replied ? 'Mark as NOT replied' : 'Mark as replied'}"><i class="fas fa-${it.replied ? 'rotate-left' : 'check'}"></i></button>
      <button class="mini bad" data-act="delete" data-id="${+it.id}" title="Delete"><i class="fas fa-trash"></i></button>
    </div></td></tr>`).join('');
  $('rows').innerHTML = rows || '<tr><td colspan="8" class="empty"><i class="fas fa-inbox" style="font-size:32px"></i><p style="margin-top:8px">No inquiries match your filters.</p></td></tr>';
  const from = S.total ? (S.page - 1) * S.pageSize + 1 : 0, to = Math.min(S.total, S.page * S.pageSize);
  $('pagerInfo').textContent = `Showing ${from}-${to} of ${S.total}`;
  $('pageNo').textContent = `Page ${S.page} of ${S.pages}`;
  $('prevBtn').disabled = S.page <= 1; $('nextBtn').disabled = S.page >= S.pages;
  $('selAll').checked = S.items.length > 0 && S.items.every(i => S.sel.has(i.id));
  updateBulk();
}

function updateBulk() {
  $('bulkBar').classList.toggle('show', S.sel.size > 0);
  $('bulkCount').textContent = S.sel.size + ' selected';
}
const reloadAll = () => Promise.all([loadStats(), loadList()]);

/* ============ ACTIONS ============ */
async function setReplied(id, replied) {
  const r = await api('/inquiries/' + id, { method: 'PATCH', body: JSON.stringify({ replied }) });
  toast(r.success ? (replied ? 'Marked as replied' : 'Marked as NOT replied') : r.error, r.success ? 'ok' : 'err');
  if (r.success) await reloadAll();
  return r.success;
}
async function removeOne(id) {
  if (!confirm('Permanently delete inquiry #' + id + '? This cannot be undone.')) return false;
  const r = await api('/inquiries/' + id, { method: 'DELETE' });
  toast(r.success ? 'Inquiry deleted' : r.error, r.success ? 'ok' : 'err');
  if (r.success) { S.sel.delete(id); await reloadAll(); }
  return r.success;
}
async function bulk(action) {
  const ids = [...S.sel]; if (!ids.length) return;
  if (action === 'delete' && !confirm('Permanently delete ' + ids.length + ' inquiries? This cannot be undone.')) return;
  const r = await api('/inquiries/bulk', { method: 'POST', body: JSON.stringify({ action, ids }) });
  toast(r.success ? r.count + ' updated' : r.error, r.success ? 'ok' : 'err');
  if (r.success) { S.sel.clear(); await reloadAll(); }
}
function openMail(it, full) {
  const link = mailtoFor(it, full);
  if (!link) { toast('This inquiry has no valid email address to reply to.', 'err'); return false; }
  window.location.href = link; return true;
}

async function openDetail(id) {
  const r = await api('/inquiries/' + id); if (!r.success) return toast(r.error, 'err');
  const it = r.item, link = mailtoFor(it, it.message);
  $('modal').innerHTML = `<button class="x" id="mx" aria-label="Close"><i class="fas fa-xmark"></i></button>
    <h2>${esc(it.subject) || '(no subject)'}</h2><div>${statusBadge(it)} <span class="small">&nbsp;Inquiry #${+it.id}</span></div>
    <div class="meta">
      <div><small>Name</small>${esc(it.name) || '-'}</div>
      <div><small>Email</small>${esc(it.email) || '-'}</div>
      <div><small>Rating</small>${stars(it.rating)} ${it.rating == null ? '' : '(' + esc(it.rating) + '/5)'}</div>
      <div><small>Received</small>${fmtDate(it.created_at)}</div>
      <div><small>Reply status (stored)</small>${esc(it.reply_status) || '-'}</div>
    </div>
    <div class="small" style="margin-bottom:6px">Message</div><div class="msg" id="mmsg"></div>
    <div class="mbtns">
      <button class="btn" id="m_reply" ${link ? '' : 'disabled title="No valid email address"'}><i class="fas fa-envelope"></i> Reply by email</button>
      <button class="btn ok" id="m_replyMark" ${link ? '' : 'disabled'}><i class="fas fa-paper-plane"></i> Reply &amp; mark replied</button>
      <button class="btn ${it.replied ? 'warn' : 'ok'}" id="m_toggle"><i class="fas fa-${it.replied ? 'rotate-left' : 'check'}"></i> ${it.replied ? 'Mark as NOT replied' : 'Mark as replied'}</button>
      <button class="btn out" id="m_copy"><i class="far fa-copy"></i> Copy email</button>
      <button class="btn bad" id="m_del"><i class="fas fa-trash"></i> Delete</button>
    </div>`;
  $('mmsg').textContent = it.message || '(empty message)';          // textContent: never interpreted as HTML
  $('modalBg').classList.add('show');
  $('mx').onclick = closeModal;
  $('m_reply').onclick = () => openMail(it, it.message);
  $('m_replyMark').onclick = async () => { if (openMail(it, it.message)) { await setReplied(it.id, true); closeModal(); } };
  $('m_toggle').onclick = async () => { if (await setReplied(it.id, !it.replied)) closeModal(); };
  $('m_copy').onclick = async () => { try { await navigator.clipboard.writeText(it.email || ''); toast('Email copied', 'ok'); } catch { toast('Copy failed', 'err'); } };
  $('m_del').onclick = async () => { if (await removeOne(it.id)) closeModal(); };
}
const closeModal = () => $('modalBg').classList.remove('show');

async function exportCsv() {
  $('exportBtn').disabled = true;
  const r = await api('/inquiries/export?' + qs(), { raw: true });
  $('exportBtn').disabled = false;
  if (!r.success) return toast(r.error || 'Export failed', 'err');
  const blob = await r.res.blob(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'inquiries-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('CSV downloaded', 'ok');
}

/* ============ BOOT ============ */
function showDenied(msg) {
  $('loading').style.display = 'none'; $('app').style.display = 'none';
  if (msg) $('deniedMsg').textContent = msg;
  $('denied').style.display = 'flex';
}
async function logout() {
  try { await fetch(LOGIN_API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN } }); } catch (e) {}
  goLogin();
}

function bind() {
  let t; $('q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value.trim(); S.page = 1; loadList(); }, 350); };
  $('statusSeg').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.status = b.dataset.s; S.page = 1;
    document.querySelectorAll('#statusSeg button').forEach(x => x.classList.toggle('on', x === b)); loadList(); };
  $('rating').onchange = (e) => { S.rating = e.target.value; S.page = 1; loadList(); };
  $('from').onchange = (e) => { S.from = e.target.value; S.page = 1; loadList(); };
  $('to').onchange = (e) => { S.to = e.target.value; S.page = 1; loadList(); };
  $('sort').onchange = (e) => { [S.sort, S.dir] = e.target.value.split(':'); S.page = 1; loadList(); };
  $('pageSize').onchange = (e) => { S.pageSize = +e.target.value; S.page = 1; loadList(); };
  $('clearBtn').onclick = () => { Object.assign(S, { q: '', status: 'all', rating: '', from: '', to: '', sort: 'created_at', dir: 'desc', page: 1 });
    $('q').value = ''; $('rating').value = ''; $('from').value = ''; $('to').value = ''; $('sort').value = 'created_at:desc';
    document.querySelectorAll('#statusSeg button').forEach(x => x.classList.toggle('on', x.dataset.s === 'all')); loadList(); };
  $('prevBtn').onclick = () => { if (S.page > 1) { S.page--; loadList(); } };
  $('nextBtn').onclick = () => { if (S.page < S.pages) { S.page++; loadList(); } };
  $('refreshBtn').onclick = () => { reloadAll(); toast('Refreshed', 'ok'); };
  $('exportBtn').onclick = exportCsv;
  $('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  $('logoutBtn').onclick = logout; $('deniedLogout').onclick = logout; $('deniedHome').onclick = () => { location.href = HOME_URL; };
  $('selAll').onchange = (e) => { S.items.forEach(i => e.target.checked ? S.sel.add(i.id) : S.sel.delete(i.id)); renderRows(); };
  $('bulkClear').onclick = () => { S.sel.clear(); renderRows(); };
  $('bulkBar').onclick = (e) => { const b = e.target.closest('[data-bulk]'); if (b) bulk(b.dataset.bulk); };
  $('rows').onchange = (e) => { const c = e.target.closest('.sel'); if (!c) return; const id = +c.dataset.id; c.checked ? S.sel.add(id) : S.sel.delete(id); renderRows(); };
  $('rows').onclick = async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = +b.dataset.id, it = S.items.find(x => x.id === id); if (!it) return;
    if (b.dataset.act === 'view') openDetail(id);
    else if (b.dataset.act === 'reply') openMail(it, it.preview);
    else if (b.dataset.act === 'toggle') setReplied(id, !it.replied);
    else if (b.dataset.act === 'delete') removeOne(id);
  };
  $('modalBg').onclick = (e) => { if (e.target === $('modalBg')) closeModal(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
}

function applyTheme(t) { document.documentElement.dataset.theme = t; $('themeBtn').innerHTML = '<i class="fas fa-' + (t === 'dark' ? 'sun' : 'moon') + '"></i>'; localStorage.setItem('inq_theme', t); }

async function boot() {
  TOKEN = getToken(); if (!TOKEN) return goLogin();
  try {
    const out = await (window.__ME || fetch(API + '/me', { headers: { Authorization: 'Bearer ' + TOKEN } })
      .then(r => r.json().then(d => ({ status: r.status, data: d }))));
    if (out.status === 401) return goLogin();
    if (out.status === 403 || !out.data.success) return showDenied(out.data && out.data.error);
    ADMIN = out.data.admin;
  } catch (e) {
    $('loadingText').textContent = 'Could not reach the server. Check your connection.';
    $('retryBtn').style.display = 'inline-block'; document.querySelector('#loading .spinner').style.display = 'none'; return;
  }
  $('adminName').textContent = ADMIN.name || ADMIN.email;
  bind(); $('app').style.display = 'block'; $('loading').style.display = 'none';
  await reloadAll();
}
window.addEventListener('pageshow', (e) => { if (e.persisted && !getToken()) goLogin(); });
applyTheme(localStorage.getItem('inq_theme') || 'light');
boot();
</script>
</body>
</html>
