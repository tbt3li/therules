<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #faf9f8; color: #323130; min-height: 100vh; }

        .topbar {
            background: #201f1e; color: white; padding: 14px 30px; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .topbar h2 { font-size: 20px; font-weight: 600; }
        .topbar h2 i { color: #0078d4; margin-right: 8px; }
        .topbar-right { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .btn-logout {
            background: #dc3545; color: white; border: none; padding: 9px 18px; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .btn-logout:hover { background: #bb2d3b; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .welcome {
            background: linear-gradient(135deg, #0078d4, #5c2d91); color: white; border-radius: 12px;
            padding: 35px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
        }
        .welcome h1 { font-size: 28px; margin-bottom: 8px; }
        .welcome p { opacity: .9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .card i { font-size: 30px; color: #0078d4; margin-bottom: 12px; }
        .card h3 { margin-bottom: 8px; }
        .card p { color: #605e5c; font-size: 14px; line-height: 1.5; word-break: break-word; }

        #loading {
            position: fixed; inset: 0; background: #faf9f8; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #0078d4; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading"><div class="loader-spinner"></div></div>

    <div class="topbar">
        <h2><i class="fas fa-shield-halved"></i> Family Gang Dashboard</h2>
        <div class="topbar-right">
            <span><i class="fas fa-user"></i> <span id="topEmail">...</span></span>
            <button class="btn-logout" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="welcome">
            <h1>Welcome, <span id="userName">Member</span>! 🎉</h1>
            <p>You are logged in successfully. This is a simple demo dashboard.</p>
        </div>

        <div class="grid">
            <div class="card">
                <i class="fas fa-id-card"></i>
                <h3>Your Account</h3>
                <p>Email: <strong id="cardEmail">-</strong></p>
                <p>User ID: <strong id="cardId">-</strong></p>
            </div>
            <div class="card">
                <i class="fas fa-book"></i>
                <h3>Premium Tutorials</h3>
                <p>Demo card. Put your tutorials and guides here.</p>
            </div>
            <div class="card">
                <i class="fas fa-chart-line"></i>
                <h3>Clan Statistics</h3>
                <p>Demo card. Put your member stats here.</p>
            </div>
        </div>
    </div>

<script>
const API_URL = 'https://login.t3li.workers.dev/api';
const LOGIN_URL = 'login.html';

function getToken() {
    return localStorage.getItem('family_token') || sessionStorage.getItem('family_token');
}
function clearToken() {
    localStorage.removeItem('family_token');
    sessionStorage.removeItem('family_token');
}
function goToLogin() {
    clearToken();
    window.location.replace(LOGIN_URL);
}

async function init() {
    const token = getToken();
    if (!token) return goToLogin();

    try {
        const res = await fetch(API_URL + '/check', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        if (!data.success) return goToLogin();

        const u = data.user;
        document.getElementById('userName').textContent = u.name || u.email;
        document.getElementById('topEmail').textContent = u.email;
        document.getElementById('cardEmail').textContent = u.email;
        document.getElementById('cardId').textContent = u.id;
        document.getElementById('loading').style.display = 'none';
    } catch (err) {
        console.error(err);
        goToLogin();
    }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
    const token = getToken();
    try {
        await fetch(API_URL + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
    } catch (e) { /* ignore network errors, still log out locally */ }
    goToLogin();
});

init();
</script>
</body>
</html>
