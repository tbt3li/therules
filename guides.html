<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Battle Guides | THE Family Gang</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f3f2f1;--card:#fff;--text:#323130;--muted:#605e5c;--border:#e1dfdd;--primary:#0078d4;--accent:#7c4dbd;--gold:#8a6500;--goldbg:#fff3cd}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1e1d;--text:#f3f2f1;--muted:#a19f9d;--border:#3b3a39;--gold:#ffd75e;--goldbg:#4a3b00}}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#201f1e,#2b2250);color:#fff;padding:40px 20px;text-align:center}
header h1{font-size:30px;margin-bottom:8px}header p{opacity:.85;max-width:640px;margin:0 auto 18px}
.btn{display:inline-block;background:var(--primary);color:#fff;padding:11px 22px;border-radius:8px;font-weight:600;text-decoration:none;margin:4px}
.btn.alt{background:transparent;border:2px solid #fff}
main{max-width:1200px;margin:28px auto;padding:0 16px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;height:150px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{padding:16px;flex:1}.body h2{font-size:18px;margin-bottom:4px}.body p{color:var(--muted);font-size:14px;margin-bottom:10px}
ul{list-style:none;font-size:13.5px}li{padding:4px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.tag{font-size:11px;font-weight:700;background:var(--goldbg);color:var(--gold);padding:1px 8px;border-radius:20px;white-space:nowrap}
.more{color:var(--muted);font-size:13px;margin-top:6px}
footer{text-align:center;color:var(--muted);padding:24px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Total Battle Guides</h1>
  <p>Captains, equipment, city, combat, clan and research guides from THE Family Gang (Kingdom 34). Free guides need a free account; premium guides unlock by clan role.</p>
  <a class="btn" href="login.html"><i class="fas fa-right-to-bracket"></i> Member login</a>
  <a class="btn alt" href="index.html"><i class="fas fa-home"></i> Home</a>
</header>
<main id="grid"><p style="color:var(--muted)">Loading categories...</p></main>
<footer>&copy; 2026 THE Family Gang</footer>
<script>
const API = 'https://login.t3li.workers.dev/api';
const esc = s => { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
const okImg = u => /^(https:\/\/|\/?assets\/)[^\s"'<>]+$/.test(u || '');
fetch(API + '/guides/categories').then(r => r.json()).then(d => {
  if (!d.success) throw 0;
  document.getElementById('grid').innerHTML = d.categories.map(c => `<article class="card">
    <div class="thumb"><i class="fas ${esc(c.icon)}"></i>${okImg(c.image_url) ? `<img src="${esc(c.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}</div>
    <div class="body"><h2>${esc(c.label)}</h2><p>${esc(c.description)} (${c.count} guides)</p>
    <ul>${c.titles.slice(0, 6).map(t => `<li><span>${esc(t.title)}</span>${t.premium ? '<span class="tag">Premium</span>' : ''}</li>`).join('')}</ul>
    ${c.count > 6 ? `<div class="more">+ ${c.count - 6} more after login</div>` : ''}</div></article>`).join('');
}).catch(() => { document.getElementById('grid').innerHTML = '<p>Could not load guides. Please try again later.</p>'; });
</script>
</body>
</html>
